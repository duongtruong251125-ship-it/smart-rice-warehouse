plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningPropertiesFile = rootProject.file("key.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

def releaseSigningKeys = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def missingReleaseSigningKeys = releaseSigningKeys.findAll {
    !releaseSigningProperties.getProperty(it)?.trim()
}
def releaseSigningConfigured = releaseSigningPropertiesFile.exists() &&
    missingReleaseSigningKeys.isEmpty()
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

def flutterDartDefines = (project.findProperty("dart-defines") ?: "")
    .toString()
    .split(",")
    .findAll { !it.isEmpty() }
    .collect { encoded ->
        new String(java.util.Base64.decoder.decode(encoded), "UTF-8")
    }
def supabaseReleaseSelected = flutterDartDefines.contains("USE_SUPABASE=true")
def supabaseReleaseConfigured = flutterDartDefines.any {
    it.startsWith("SUPABASE_URL=") && it.length() > "SUPABASE_URL=".length()
} && flutterDartDefines.any {
    it.startsWith("SUPABASE_PUBLISHABLE_KEY=") &&
        it.length() > "SUPABASE_PUBLISHABLE_KEY=".length()
}

if (releaseTaskRequested && (!supabaseReleaseSelected || !supabaseReleaseConfigured)) {
    throw new GradleException(
        "Release builds must select Supabase and provide SUPABASE_URL plus " +
            "SUPABASE_PUBLISHABLE_KEY. Use tool/build_supabase_release.ps1."
    )
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    def detail = releaseSigningPropertiesFile.exists()
        ? "Missing keys: ${missingReleaseSigningKeys.join(', ')}."
        : "Missing android/key.properties."
    throw new GradleException(
        "Release builds require a private upload keystore. ${detail} " +
            "See RELEASE_CHECKLIST.md; never commit the keystore or key.properties."
    )
}

android {
    namespace = "com.example.smart_rice_warehouse"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.smart_rice_warehouse"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
                storeFile = rootProject.file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
